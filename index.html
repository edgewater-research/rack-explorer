<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rack Explorer</title>
<meta name="description" content="Interactive AI rack network explorer: scale-up and scale-out architectures (NVL72, Vera Rubin, Trainium, TPU, Helios) with editable chip counts, lane rates, link counts and media assumptions.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <header class="top">
    <div class="wordmark"><span class="eyebrow">Edgewater Research</span><span class="name">Rack Explorer</span></div>
    <select id="preset-select" class="ctl" aria-label="Rack architecture"></select>
    <div class="tabs" role="tablist" id="view-tabs">
      <button role="tab" data-view="board">Board</button>
      <button role="tab" data-view="tray">Tray</button>
      <button role="tab" data-view="rack">Rack</button>
      <button role="tab" data-view="scaleup">Scale-up fabric</button>
      <button role="tab" data-view="scaleout">Scale-out</button>
      <button role="tab" data-view="compare">Compare</button>
    </div>
    <div class="spacer"></div>
    <button class="btn" id="btn-export" title="Download the current build and assumptions as JSON">Export JSON</button>
    <button class="btn" id="btn-import" title="Load a build from a JSON file">Import</button>
    <input type="file" id="file-import" accept="application/json" hidden>
    <button class="btn" id="btn-svg" title="Download the current drawing as SVG">Save SVG</button>
    <button class="btn icon" id="btn-theme" title="Toggle light / dark">◐</button>
  </header>
  <main class="work">
    <aside class="rail" aria-label="Library">
      <h3>Rack architectures</h3>
      <div class="preset-list" id="preset-list"></div>
      <h3>Building blocks</h3>
      <div class="blocks" id="blocks"></div>
      <h3>Interconnect media</h3>
      <div class="media-legend" id="media-legend"></div>
    </aside>
    <section class="center">
      <div class="stats" id="stats"></div>
      <div class="notices" id="notices"></div>
      <div class="canvas-wrap" id="canvas-wrap">
        <div class="canvas-tools">
          <button class="btn small" id="zoom-out" title="Zoom out">−</button>
          <button class="btn small" id="zoom-fit" title="Fit">Fit</button>
          <button class="btn small" id="zoom-in" title="Zoom in">+</button>
        </div>
        <div id="canvas"></div>
      </div>
    </section>
    <aside class="side" aria-label="Details">
      <div class="side-tabs" role="tablist" id="side-tabs">
        <button role="tab" data-tab="inspect">Inspector</button>
        <button role="tab" data-tab="build">Build</button>
        <button role="tab" data-tab="assume">Assumptions</button>
        <button role="tab" data-tab="bom">Bill of interconnect</button>
      </div>
      <div class="side-body" id="side-body"></div>
    </aside>
  </main>
</div>
<script src="js/data.js"></script>
<script src="js/compute.js"></script>
<script src="js/render.js"></script>
<script src="js/app.js"></script>
</body>
</html>
